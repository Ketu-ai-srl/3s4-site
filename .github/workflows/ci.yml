name: CI

on:
  # Fara `paths-ignore`: promovarea unui lot cere un verdict CI pe sha-ul exact.
  # Un lot numai cu documente n-ar fi produs nicio rulare, iar promoveaza.sh l-ar fi
  # refuzat cu "zero rulari CI" - o poarta care blocheaza exact cazul pentru care exista.
  # Depozitul e public, deci minutele nu sunt argument.
  push:
    # `lot/**` e aici fiindca promovarea cere un verdict CI pe sha-ul EXACT al lotului,
    # inainte ca el sa atinga `main`. Fara asta, `promoveaza.sh` refuza corect cu "zero
    # rulari CI", iar singurul drum ramas ar fi sa impingi direct in `main` si sa afli
    # dupa. Un lot pe zi inseamna o rulare in plus, pe un depozit public.
    #
    # `ci/**` (25.09.2026): verdictul de test al feliilor si loturilor vine de aici, nu de pe statia de
    # lucru (depozit public: minutele sunt gratuite, iar poarta locala ocupa masina agentilor). Pe
    # `ci/<nume>` se impinge un INSTANTANEU - acelasi arbore ca felia, parinte `main` - prin
    # `ci-instantaneu.sh` al fabricii, ca istoricul de lucru sa nu devina public.
    branches: [main, 'lot/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verdict:
    name: Verdict CI
    # WINDOWS, nu Linux (25.09.2026). Masuratorile referintei si probele de browser care le cer la
    # ±3 px au fost facute pe Windows. Prima rulare pe ubuntu-latest (36159283064) a picat 4 din 287,
    # toate pe geometrie si interactiuni: randul de integrari al constructorului 1598 fata de 1569 la
    # 390 (un rand de text rupt altfel), inaltimile lumilor si ale chestionarului, turul eroului la
    # 390 tactil. Aceleasi probe trec pe statia Windows. CI verifica deci pe acelasi sistem pe care
    # s-au luat cifrele; depozitul e public, deci si runner-ele Windows sunt gratuite.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # Limita e ~2x durata proiectata pentru ~60 de rute (planul valului S4, P4 si §6.11), nu
    # pentru azi. Masurat pe 2026-09-24, pe masina de lucru a feliei `fundatie` (Windows), cu o
    # singura ruta: `pnpm verifica` = 104 s, din care portile de browser 49 s pentru 37 de probe.
    # Portile care trec prin fiecare ruta costa ~9,6 s pe ruta (accesibilitate 2,6 + terti 3,9 +
    # derapaj 1,0 + HTML brut 1,2 + legaturi 0,9). Proiectie la ~60 de rute: ~9,6 min pentru ele,
    # ~5 min restul lantului (build mai mare, probele feliilor S4-2..S4-4), ~2 min instalarea si
    # Chromium in CI = ~17 min; limita 35. Viteza masinii de CI fata de cea locala NU e masurata:
    # la primul verdict cu peste 40 de rute se compara durata reala cu proiectia si se reface cifra.
    # Alternativa lasata deocamdata: portile de browser impartite pe joburi paralele. Cere build-ul
    # repetat in fiecare job si o verificare ca promovarea citeste toate joburile, nu doar acesta;
    # se reia daca durata reala trece de jumatatea limitei.
    # Masurat 25.09 pe ubuntu-latest, 22 de rute: 1062 s in total, din care 15,6 min probele de browser
    # (287). Runner-ul Windows e mai lent, iar valul S4 aduce ~40 de rute: limita 60.
    # Masurat 26.09 pe windows-latest, lotul de proba S4-3 (39 de pagini statice, 582 unit + 753 browser):
    # 41,3 min in total, din care `pnpm verifica` 37,6 min. S4-4a aduce inca ~13 rute, deci ~55 min, prea
    # aproape de 60: limita 120. Impartirea portilor de browser pe joburi ramane alternativa de mai sus.
    timeout-minutes: 120
    env:
      BUILD_STANDALONE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # TEMP pe acelasi disc cu depozitul. Pe runner-ul Windows depozitul sta pe D: si TEMP pe C:;
      # probele care construiesc o COPIE a site-ului in TEMP (comutatorul operatorului, antetul)
      # au picat cu `Can't resolve './D:/a/3s4-site/...next/dist/client/next.js'`: webpack nu poate
      # scrie o cale relativa intre doua discuri (rularea 36161321352). Pe statie totul e pe C:.
      - run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # Probele de browser fac parte din `pnpm verifica`, deci si din poarta locala:
      # poarta.sh isi citeste pasii din acelasi script. Fara pasul asta, CI a picat
      # 17 din 17 cu "Executable doesn't exist" - masurat pe rularea 33965447045.
      # Se instaleaza doar chromium: probele ruleaza pe un singur motor.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verifica
      - name: Declanseaza deploy staging
        if: github.ref == 'refs/heads/main' && success()
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ]; then
            echo "COOLIFY_DEPLOY_URL nu e setat inca - deploy-ul se declanseaza manual din Coolify"
            exit 0
          fi
          curl -sf -X POST "$COOLIFY_DEPLOY_URL"

  # AL DOILEA BUILD: aplicatia 3s.md (fundatia editiilor, `src/lib/editii.ts`). Acelasi cod se construieste cu
  # variabilele din `config/profil-3s-md.json` (SITE_EDITII=en,ro-MD, operatorul-model, mediul de proba): pe acest
  # profil arborele romanesc nu exista deloc, deci nimic din jobul de mai sus nu-l masoara. Aici se masoara ce
  # serveste: poarta juridica pe build-ul lui si proba editiilor pe serverul lui (`tests/editii.test.ts`, blocul
  # care cere `EDITII_ADRESA`). Job separat, in paralel cu cel de mai sus: concluzia rularii le cere pe amandoua.
  # Fara `BUILD_STANDALONE`: serverul pornit aici e `next start`, iar iesirea standalone nu schimba paginile.
  # Windows, ca jobul de mai sus. Durata: masurata la primul verdict, scrisa aici dupa aceea.
  profil-3s-md:
    name: Profil 3s.md
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # Variabilele profilului intra in mediul pasilor urmatori; cheile cu `_` sunt note, o valoare obiect se scrie ca JSON.
      - name: Variabilele aplicatiei 3s.md
        run: |
          node -e "const p=require('./config/profil-3s-md.json');const fs=require('fs');for(const [k,v] of Object.entries(p)){if(k.startsWith('_'))continue;fs.appendFileSync(process.env.GITHUB_ENV,k+'='+(typeof v==='string'?v:JSON.stringify(v))+'\n')}"
      - run: pnpm build
      # Poarta juridica pe build-ul 3s.md, cu paginile juridice EN si RO-MD construite. Pe staging e blocanta, iar
      # iesirea trebuie sa poarte linia modelului D2 (operatorul-model din profil a fost citit, nu sarit).
      - name: Poarta juridica 3s.md (staging, blocant)
        run: |
          python .claude/scripts/porti/poarta-juridic.py --mediu staging | tee "$RUNNER_TEMP/poarta-juridic-staging.log"
          grep -q '^model D2: aprins' "$RUNNER_TEMP/poarta-juridic-staging.log" || { echo "lipseste linia 'model D2' din iesirea portii juridice"; exit 1; }
      # Pe productie, INFORMATIV pana la poarta B: raman intentionat marcajele reprezentantului UE (asteapta juristul),
      # cum le raporteaza poarta pe productie. Ce alte marcaje mai admite J-01 (forma "[de publicat ...]" si perechea ei
      # engleza) se citeste in registrul MARCAJE_ADMISE din poarta, iar ce note mai raman in textele juridice (N20, N26)
      # se citeste in iesirea ei pe productie: comentariul nu le fixeaza, fiindca se schimba odata cu textele juridice.
      # N23 (tara gazdei) a iesit din textele juridice. Pasul nu pica jobul; iesirea numeste ce mai opreste publicarea.
      # Trecerea lui pe blocant e pasul portii B, nu al feliei.
      - name: Poarta juridica 3s.md (productie, informativ)
        run: |
          python .claude/scripts/porti/poarta-juridic.py --mediu productie || echo "poarta juridica pe productie a iesit $? (informativ pana la poarta B)"
      # Poarta de SEO pe HTML-ul build-ului 3s.md: CANALE_JSON din profil e in mediu, deci telefonul canalului e permis in JSON-LD, si numai el.
      - run: python .claude/scripts/porti/poarta-seo.py
      # Reciprocitatea hreflang a lui 3s.md NU se mai masoara aici, pe un singur build: grupul hreflang e comun celor
      # doua domenii (`ro-RO` -> 3s.com.ro, `SITE_ALTERNATE` din profil), deci o pereche are un capat pe fiecare si
      # poarta pe un build ar iesi 3 pe tintele 3s.com.ro. Se masoara in jobul "Profil 3s.com.ro", cu
      # `poarta-reciprocitate.py --intre-domenii` pe colectia de mai jos si pe a lui (R-01 - R-04, R-06 - R-08, pe
      # ambele domenii). Pe build-ul romanesc poarta ruleaza in porti:build, pe un build, si cere zero alternate.
      - name: Colectia 3s.md, pentru reciprocitatea intre domenii
        run: node .claude/scripts/porti/colecteaza-build.mjs --iesire "$RUNNER_TEMP/colectie-3s-md" --port 4751
      # Artefactul il citeste jobul "Profil 3s.com.ro" din ACEEASI rulare (si, la nevoie, cine analizeaza o identitate rosie
      # in zilele urmatoare): 7 zile ajung, nu cele 90 implicite.
      - name: Colectia 3s.md, ca artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: colectie-3s-md
          path: ${{ runner.temp }}/colectie-3s-md
          if-no-files-found: error
          retention-days: 7
      - name: Proba editiilor, pe serverul build-ului 3s.md
        run: |
          pnpm exec next start -p 4750 -H 127.0.0.1 > "$RUNNER_TEMP/server-3s-md.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4750/robots.txt && break; sleep 1; done
          EDITII_ADRESA=http://127.0.0.1:4750 pnpm exec vitest run tests/editii.test.ts
      - name: Jurnalul serverului 3s.md
        if: always()
        run: cat "$RUNNER_TEMP/server-3s-md.log" || true

  # AL TREILEA BUILD: aplicatia 3s.com.ro. Acelasi site ca 3s.md (editiile en si ro-MD, acelasi operator), asezat cu
  # romana la radacina si engleza sub /en (`SITE_ASEZARE=ro`, `src/lib/asezare.ts`), din `config/profil-3s-com-ro.json`.
  # Pe asezarea `ro` se construiesc numai fisierele-geamana `*.comro.tsx` din `(comro)` si `(comroen)` (`pageExtensions`),
  # deci nimic din joburile de mai sus nu masoara acest arbore. Aici: poarta oglinzii pe surse (si proba ei), build-ul,
  # poarta juridica si poarta SEO pe HTML-ul lui, apoi pe server: multimea cailor servite egala cu geamanele cailor
  # 3s.md (`perechi-asezare.mjs` + poarta oglinzii pe colectie), redirectarile vechilor adrese `/ro`, pagina de
  # negasit romaneasca si documentele juridice nepublicate (poarta C) la 404. Colectia build-ului se publica ca artefact,
  # pentru comparatiile intre domenii. Fara `BUILD_STANDALONE`, ca jobul 3s.md. Durata: masurata la primul verdict.
  profil-3s-com-ro:
    name: Profil 3s.com.ro
    # Asteapta jobul 3s.md: reciprocitatea hreflang intre domenii are nevoie de colectia lui (artefactul `colectie-3s-md`).
    needs: profil-3s-md
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # Pe surse, inainte de build: fiecare pagina din (en) / (romd) are geamana ei, si geamana e o reexportare pura.
      - run: python .claude/scripts/porti/probe/proba-oglinda-asezare.py
      - run: python .claude/scripts/porti/poarta-oglinda-asezare.py
      - name: Variabilele aplicatiei 3s.com.ro
        run: |
          node -e "const p=require('./config/profil-3s-com-ro.json');const fs=require('fs');for(const [k,v] of Object.entries(p)){if(k.startsWith('_'))continue;fs.appendFileSync(process.env.GITHUB_ENV,k+'='+(typeof v==='string'?v:JSON.stringify(v))+'\n')}"
      - run: pnpm build
      # Poarta juridica pe build-ul 3s.com.ro: citeste asezarea din build (.next/required-server-files.json) si cauta
      # documentele familiei md la adresele servite (/juridic/..., /en/legal/...). Iesirea trebuie sa poarte linia
      # modelului D2 si linia asezarii `ro` (altfel poarta ar masura caile 3s.md pe un arbore care nu le are).
      - name: Poarta juridica 3s.com.ro (staging, blocant)
        run: |
          python .claude/scripts/porti/poarta-juridic.py --mediu staging | tee "$RUNNER_TEMP/poarta-juridic-com-ro.log"
          grep -q '^model D2: aprins' "$RUNNER_TEMP/poarta-juridic-com-ro.log" || { echo "lipseste linia 'model D2' din iesirea portii juridice"; exit 1; }
          grep -q '^asezare: ro ' "$RUNNER_TEMP/poarta-juridic-com-ro.log" || { echo "lipseste linia 'asezare: ro' din iesirea portii juridice"; exit 1; }
      - run: python .claude/scripts/porti/poarta-seo.py
      # Colectia (ce serveste `next start`, cale cu cale) si perechile 3s.md -> 3s.com.ro (rutele 3s.md trecute prin
      # `caleServita`); poarta oglinzii cere ca multimea cailor servite sa fie EXACT partea 3s.com.ro a perechilor, plus
      # caile proprii asezarii (lista ei inchisa).
      - name: Colectia build-ului si oglinda pe server
        run: |
          node .claude/scripts/porti/colecteaza-build.mjs --iesire "$RUNNER_TEMP/colectie-3s-com-ro" --port 4770
          node .claude/scripts/porti/perechi-asezare.mjs --profil-a config/profil-3s-md.json --profil-b config/profil-3s-com-ro.json --iesire "$RUNNER_TEMP/perechi-3s-md-3s-com-ro.json"
          python .claude/scripts/porti/poarta-oglinda-asezare.py --colectie "$RUNNER_TEMP/colectie-3s-com-ro" --perechi "$RUNNER_TEMP/perechi-3s-md-3s-com-ro.json"
      # Reciprocitatea hreflang INTRE domenii: grupul comun (`SITE_ALTERNATE`, aceeasi valoare pe ambele profiluri) are
      # capete pe 3s.md (en, ro-MD) si pe 3s.com.ro (ro-RO), deci se masoara pe ambele colectii odata: fiecare pereche are
      # inversa (R-01), tinta e o pagina servita (R-02), auto-referinta (R-03), paginile cu pereche = echivalentele (R-04),
      # aceeasi multime pe toate capetele (R-06), copia engleza a lui 3s.com.ro fara hreflang si cu canonical spre 3s.md
      # (R-07), aceeasi lista pe ambele profiluri (R-08). Iesirea numara legaturile pe cod, pe fiecare domeniu.
      - name: Colectia 3s.md (artefactul jobului 3s.md)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: colectie-3s-md
          path: ${{ runner.temp }}/colectie-3s-md
      - name: Reciprocitatea hreflang intre 3s.md si 3s.com.ro
        run: |
          python .claude/scripts/porti/poarta-reciprocitate.py --intre-domenii \
            --colectie-a "$RUNNER_TEMP/colectie-3s-md" --profil-a config/profil-3s-md.json \
            --colectie-b "$RUNNER_TEMP/colectie-3s-com-ro" --profil-b config/profil-3s-com-ro.json
      # Pe server, cazurile pe care multimea cailor nu le vede: redirectarile permanente ale vechilor adrese ale romanei,
      # pagina de negasit (romaneasca, noindex), un document juridic nepublicat la poarta curenta (dpa, poarta C: 404, deci
      # `dynamicParams = false` scris literal in geamana functioneaza) si limba paginilor. Martorul serverului: robots.txt 200.
      - name: Proba asezarii pe serverul build-ului 3s.com.ro
        run: |
          pnpm exec next start -p 4771 -H 127.0.0.1 > "$RUNNER_TEMP/server-3s-com-ro.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4771/robots.txt && break; sleep 1; done
          A=http://127.0.0.1:4771
          esec=0
          verifica() { if [ "$2" = "$3" ]; then echo "OK    $1: $2"; else echo "PICA  $1: $2 (asteptat $3)"; esec=1; fi; }
          verifica 'robots.txt (martorul serverului)' "$(curl -s -o /dev/null -w '%{http_code}' $A/robots.txt)" 200
          verifica '/ status' "$(curl -s -o /dev/null -w '%{http_code}' $A/)" 200
          verifica '/ lang' "$(curl -s $A/ | grep -o '<html lang="[a-z]*"' | head -1)" '<html lang="ro"'
          verifica '/ Content-Language' "$(curl -s -D - -o /dev/null $A/ | tr -d '\r' | grep -i '^content-language:' | cut -d' ' -f2)" ro-RO
          verifica '/contact status' "$(curl -s -o /dev/null -w '%{http_code}' $A/contact)" 200
          verifica '/en lang' "$(curl -s $A/en | grep -o '<html lang="[a-z]*"' | head -1)" '<html lang="en"'
          verifica '/en/pricing Content-Language' "$(curl -s -D - -o /dev/null $A/en/pricing | tr -d '\r' | grep -i '^content-language:' | cut -d' ' -f2)" en
          verifica '/llms.txt Content-Language (text englezesc pe ambele domenii)' "$(curl -s -D - -o /dev/null $A/llms.txt | tr -d '\r' | grep -i '^content-language:' | cut -d' ' -f2)" en
          verifica '/juridic/cookies status' "$(curl -s -o /dev/null -w '%{http_code}' $A/juridic/cookies)" 200
          verifica '/juridic/dpa status (poarta C)' "$(curl -s -o /dev/null -w '%{http_code}' $A/juridic/dpa)" 404
          verifica '/ro/contact status' "$(curl -s -o /dev/null -w '%{http_code}' $A/ro/contact)" 308
          verifica '/ro/contact Location' "$(curl -s -D - -o /dev/null $A/ro/contact | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)" /contact
          verifica '/ro status' "$(curl -s -o /dev/null -w '%{http_code}' $A/ro)" 308
          verifica '/pricing status (engleza nu e la radacina)' "$(curl -s -o /dev/null -w '%{http_code}' $A/pricing)" 404
          verifica '/nu-exista status' "$(curl -s -o /dev/null -w '%{http_code}' $A/nu-exista)" 404
          verifica '/nu-exista lang' "$(curl -s $A/nu-exista | grep -o '<html lang="[a-z]*"' | head -1)" '<html lang="ro"'
          verifica '/nu-exista X-Robots-Tag noindex' "$(curl -s -D - -o /dev/null $A/nu-exista | tr -d '\r' | grep -ic '^x-robots-tag:.*noindex')" 1
          exit $esec
      # Consola browserului pe cinci cai (criteriul de gata al arborelui): zero console.error si zero erori de pagina,
      # adica nicio nepotrivire de hidratare (in productie React o raporteaza ca eroare a paginii, #418/#423/#425), pe
      # un server propriu. Martorul pozitiv e in script: / cu un text adaugat in HTML-ul servit trebuie sa dea macar o
      # eroare, altfel iesirea e 3 (masuratoare oarba). Comportamentul de dupa hidratare (selector, bara mobila,
      # canalul, paleta) nu e aici: il acopera proba de browser a asezarii, intr-o felie separata.
      - run: pnpm exec playwright install chromium
      - name: Consola browserului pe 3s.com.ro (hidratare)
        run: |
          pnpm exec next start -p 4772 -H 127.0.0.1 > "$RUNNER_TEMP/server-3s-com-ro-hidratare.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4772/robots.txt && break; sleep 1; done
          mkdir -p node_modules/.cache
          cat > node_modules/.cache/hidratare-3s-com-ro.cjs <<'SCRIPT'
          // Consola browserului pe cinci cai ale build-ului 3s.com.ro: zero console.error si zero erori de pagina (in productie
          // React raporteaza nepotrivirea de hidratare ca eroare nerecuperata a paginii, #418/#423/#425). Martorul pozitiv:
          // aceeasi pagina /, cu un text adaugat in HTML-ul servit (interceptat), trebuie sa produca macar o eroare; altfel
          // masuratoarea e oarba si iesirea e 3, nu 0.
          const { chromium } = require('@playwright/test')
          const A = process.argv[2] || 'http://127.0.0.1:4771'
          const CAI = ['/', '/contact', '/en', '/en/pricing', '/juridic/cookies']

          async function erori(browser, cale, strica) {
            const pagina = await browser.newPage()
            const gasite = []
            pagina.on('console', (m) => { if (m.type() === 'error') gasite.push('console.error: ' + m.text().slice(0, 300)) })
            pagina.on('pageerror', (e) => gasite.push('pageerror: ' + String(e.message).slice(0, 300)))
            if (strica) {
              await pagina.route(A + cale, async (ruta) => {
                const r = await ruta.fetch()
                const html = await r.text()
                const i = html.indexOf('</h1>')
                if (i < 0) throw new Error('martorul nu gaseste </h1> in ' + cale)
                await ruta.fulfill({ response: r, body: html.slice(0, i) + ' martor' + html.slice(i) })
              })
            }
            const r = await pagina.goto(A + cale, { waitUntil: 'load' })
            await pagina.waitForTimeout(2500)
            await pagina.close()
            return { status: r ? r.status() : 0, gasite }
          }

          ;(async () => {
            const browser = await chromium.launch()
            let esec = 0
            try {
              const m = await erori(browser, '/', true)
              if (m.gasite.length === 0) {
                console.log('NEMASURAT  martorul (HTML-ul lui / modificat) nu a produs nicio eroare: masuratoarea e oarba')
                process.exitCode = 3
                return
              }
              console.log('OK    martor: / cu HTML modificat -> ' + m.gasite.length + ' erori (' + m.gasite[0].slice(0, 120) + ')')
              for (const cale of CAI) {
                const { status, gasite } = await erori(browser, cale, false)
                if (status === 200 && gasite.length === 0) console.log('OK    ' + cale + ': 200, 0 erori in consola')
                else { esec = 1; console.log('PICA  ' + cale + ': ' + status + ', ' + gasite.length + ' erori\n  ' + gasite.join('\n  ')) }
              }
              process.exitCode = esec
            } finally {
              await browser.close()
            }
          })().catch((e) => { console.log('NEMASURAT  ' + e.message); process.exitCode = 3 })
          SCRIPT
          node node_modules/.cache/hidratare-3s-com-ro.cjs http://127.0.0.1:4772
      - name: Jurnalul serverului 3s.com.ro
        if: always()
        run: cat "$RUNNER_TEMP/server-3s-com-ro.log" || true
      - name: Colectia 3s.com.ro, ca artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: colectie-3s-com-ro
          path: |
            ${{ runner.temp }}/colectie-3s-com-ro
            ${{ runner.temp }}/perechi-3s-md-3s-com-ro.json
          if-no-files-found: warn
      # IDENTITATEA celor doua domenii (decizia 55: "unica diferenta trebuie sa fie emailurile si numerele de contact"):
      # colectia 3s.md (artefactul jobului 3s.md) contra colectiei 3s.com.ro, pagina cu pagina, pe perechile scrise mai
      # sus din manifestul de rute, cu lista INCHISA de diferente permise din `compara-build.py --regula identitate`
      # (originea, asezarea romanei si a englezei, contactele care difera, limba romanei, harta fara /en, randurile DNS si
      # posta din tabelul destinatarilor din politica de confidentialitate). Orice alta diferenta inroseste jobul. Iesirea tipareste numarul de perechi comparate si
      # numarul de aplicari pe fiecare regula; o regula fara nicio aplicare e tot rosu (normalizator stricat, nu
      # identitate). A doua axa, pe fiecare colectie: adresele paginilor (`url`/`item` din JSON-LD, `og:url`) duc la o pagina
      # servita, 200, in aceeasi limba (o adresa gresita la fel pe ambele domenii trece de comparatie, nu si de asta).
      # Ultimul pas al jobului, ca un rosu aici sa nu ascunda masuratorile de mai sus.
      - name: Identitatea 3s.md si 3s.com.ro
        if: ${{ !cancelled() }}
        run: |
          python .claude/scripts/porti/compara-build.py --regula identitate --perechi "$RUNNER_TEMP/perechi-3s-md-3s-com-ro.json" \
            "$RUNNER_TEMP/colectie-3s-md" "$RUNNER_TEMP/colectie-3s-com-ro" > "$RUNNER_TEMP/identitate.log" 2>&1 && cod=0 || cod=$?
          cat "$RUNNER_TEMP/identitate.log"
          grep -Eq '^perechi comparate [1-9][0-9]*;' "$RUNNER_TEMP/identitate.log" || { echo "lipseste numarul de perechi comparate (N > 0)"; exit 3; }
          exit $cod

  # INVARIANTA RELATIVA: o felie care declara ca NU schimba un site construit din acest cod (site-ul RO sau 3s.md)
  # il construieste de doua ori, pe baza ei si pe ea, colecteaza tot ce serveste `next start` (toate rutele
  # prerandate, plus robots, harta, llms, manifest, security.txt si o cale inexistenta) si cere ZERO diferente dupa
  # normalizarea identificatorilor de build (`compara-build.py --regula invarianta`). Acopera toate rutele, nu
  # paginile-martor din `tests/invarianta-ro.test.ts`.
  #
  # CAND RULEAZA: pe instantaneele feliilor care declara invarianta (lista de mai jos) si la pornire manuala
  # (`workflow_dispatch`). Pe celelalte ramuri, inclusiv pe instantaneele LOTURILOR (`ci/lot-*`), jobul e sarit, fiindca
  # o felie sau un lot care schimba legitim HTML-ul 3s.md sau ro-RO ar iesi rosu aici prin constructie, si odata cu el
  # toata rularea. Un lot care trebuie sa fie invariant (de pilda numai din felii invariante: doua felii invariante luate
  # separat nu fac un lot invariant) se ruleaza manual, cu `workflow_dispatch` pe ramura lui; pe celelalte loturi
  # diferentele de HTML sunt cele enumerate de feliile lor.
  # Felia care adauga jobul e in lista: pe ea baza si felia au acelasi `src/`, deci zero diferente e controlul uneltei
  # pe doua build-uri reale.
  #
  # BAZA = parintele instantaneului (`main` in momentul impingerii). Comparatia e deci fata de `main`, nu fata de
  # baza de lucru a feliei: daca felia a pornit de pe un lot inca neimbinat, diferentele lotului apar aici si NU sunt
  # ale feliei. Unealta, proba si normalizatorul se iau din FELIE si se copiaza inainte de a scoate baza, ca ambele
  # colectii sa treaca prin aceeasi normalizare; ambele build-uri se fac in acelasi director (caile din build nu
  # difera). Durata: masurata la primul verdict, scrisa aici dupa aceea.
  invarianta-relativa:
    name: Invarianta relativa (${{ matrix.profil }})
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["refs/heads/ci/felie-114","refs/heads/ci/felie-115","refs/heads/ci/felie-116","refs/heads/ci/felie-117","refs/heads/ci/felie-118","refs/heads/ci/felie-119","refs/heads/ci/felie-120","refs/heads/ci/felie-121"]'), github.ref)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profil: [ro-RO, 3s.md]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Baza, felia si unealta
        run: |
          FELIE="$(git rev-parse HEAD)"
          BAZA="$(git merge-base HEAD origin/main)"
          if [ "$BAZA" = "$FELIE" ]; then BAZA="$(git rev-parse HEAD^1)"; fi
          echo "FELIE=$FELIE" >> "$GITHUB_ENV"
          echo "BAZA=$BAZA" >> "$GITHUB_ENV"
          echo "felia $FELIE, baza $BAZA"
          U="$RUNNER_TEMP/unealta"
          mkdir -p "$U"
          cp .claude/scripts/porti/colecteaza-build.mjs .claude/scripts/porti/compara-build.py tests/fixturi/invarianta-ro/normalizeaza.ts "$U/"
          # Profilul 3s.md al FELIEI, copiat inainte ca checkout-ul bazei sa-l schimbe: cheile lui se scot din mediul
          # build-ului bazei (vezi pasul "Baza - build si colectie").
          cp config/profil-3s-md.json "$U/profil-3s-md-felie.json"
          cat > "$U/cu-profil.cjs" <<'SCRIPT'
          // Ruleaza o comanda cu variabilele profilului BAZEI in locul celor ale FELIEI: cheile profilului dat la --fara (al
          // feliei, puse in mediu de pasul "Variabilele aplicatiei 3s.md") se scot, apoi se pun cele ale profilului dat la
          // --cu (al bazei, citit dupa checkout). Cheile cu _ sunt note; o valoare obiect intra ca JSON, exact ca in pasul care
          // scrie GITHUB_ENV. Codul de iesire e al comenzii.
          const { readFileSync } = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const a = process.argv.slice(2)
          if (a[0] !== '--fara' || a[2] !== '--cu' || a[4] !== '--' || a.length < 6) {
            console.error('folosire: cu-profil.cjs --fara <profil> --cu <profil> -- <comanda> [argumente]')
            process.exit(2)
          }
          const chei = (cale) => Object.entries(JSON.parse(readFileSync(cale, 'utf8'))).filter(([k]) => !k.startsWith('_'))
          const env = { ...process.env }
          for (const [k] of chei(a[1])) delete env[k]
          for (const [k, v] of chei(a[3])) env[k] = typeof v === 'string' ? v : JSON.stringify(v)
          console.log('mediul comenzii: profilul ' + a[3] + ' (' + chei(a[3]).map(([k]) => k).join(', ') + ')')
          const r = spawnSync(a[5], a.slice(6), { env, stdio: 'inherit', shell: process.platform === 'win32' })
          if (r.error) console.error(String(r.error))
          process.exit(r.status === null ? 1 : r.status)
          SCRIPT
      # Proba uneltei pe colectii fabricate, inainte de a avea incredere intr-un zero pe build-uri reale.
      - run: python .claude/scripts/porti/probe/proba-compara-build.py
      - name: Variabilele aplicatiei 3s.md
        if: matrix.profil == '3s.md'
        run: |
          node -e "const p=require('./config/profil-3s-md.json');const fs=require('fs');for(const [k,v] of Object.entries(p)){if(k.startsWith('_'))continue;fs.appendFileSync(process.env.GITHUB_ENV,k+'='+(typeof v==='string'?v:JSON.stringify(v))+'\n')}"
      # Felia 119 adauga varianta `ro-RO` (3s.com.ro) in `SITE_ALTERNATE` a profilului 3s.md: singura schimbare voita pe
      # 3s.md e perechea `ro-RO` in <head>, pe paginile cu echivalente. compara-build.py nu are o scutire numarata pentru
      # ea, deci, cat timp baza nu poarta inca varianta, ambele build-uri ale acestei rulari folosesc lista BAZEI si
      # invarianta masoara ca nimic altceva nu se schimba in cod. Pasul se aplica NUMAI cand lista feliei e exact lista
      # bazei plus `ro-RO=https://3s.com.ro` (conditie pe continut, nu pe numele ramurii: tine si pe ramurile de lot).
      # Cand baza are deja varianta, pasul nu face nimic. Nu e inca mort: o pornire manuala pe `main` compara `main` cu
      # parintele lui, iar cat timp parintele n-are varianta, pasul lucreaza acolo. Orice alta schimbare a listei (si a
      # oricarei variabile din profil) se masoara normal: baza se construieste cu profilul EI, felia cu al ei (pasul
      # "Baza - build si colectie"). Perechea noua o masoara, numarata pe cod si pe domeniu, poarta de reciprocitate
      # intre domenii din jobul "Profil 3s.com.ro".
      - name: Lista hreflang a bazei (cat timp baza nu are varianta ro-RO, profilul 3s.md)
        if: matrix.profil == '3s.md'
        run: |
          LISTA="$(MSYS_NO_PATHCONV=1 git show "$BAZA:config/profil-3s-md.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).SITE_ALTERNATE||''))")"
          [ -n "$LISTA" ] || { echo "lista bazei nu se poate citi"; exit 3; }
          FEL="$(LB="$LISTA" node -e "const b=process.env.LB.split(','),f=(process.env.SITE_ALTERNATE||'').split(','),fara=f.filter(x=>x!=='ro-RO=https://3s.com.ro');process.stdout.write(b.some(x=>x.startsWith('ro-RO='))?'baza':(fara.length===f.length-1&&fara.join(',')===b.join(','))?'pereche':'alta')")"
          echo "SITE_ALTERNATE a feliei: $SITE_ALTERNATE"
          echo "SITE_ALTERNATE a bazei: $LISTA"
          echo "felul schimbarii: $FEL"
          if [ "$FEL" = "pereche" ]; then
            echo "lista bazei se foloseste pe ambele build-uri"
            echo "SITE_ALTERNATE=$LISTA" >> "$GITHUB_ENV"
          fi
      # Pe 3s.md baza se construieste si se serveste cu PROFILUL EI, nu cu al feliei: variabilele scrise mai sus in mediu
      # sunt ale feliei, iar fara pasul asta ar intra si in build-ul bazei, deci o schimbare de profil n-ar putea iesi
      # niciodata ca diferenta (invarianta ar masura numai codul). Pe ro-RO nu exista profil: mediul ramane cel implicit.
      - name: Baza - build si colectie
        run: |
          git checkout -q --detach "$BAZA"
          pnpm install --frozen-lockfile
          cu_profil() {
            if [ "${{ matrix.profil }}" != "3s.md" ]; then "$@"; return; fi
            [ -f config/profil-3s-md.json ] || { echo "baza nu are config/profil-3s-md.json: profilul bazei nu se poate citi"; exit 3; }
            node "$RUNNER_TEMP/unealta/cu-profil.cjs" --fara "$RUNNER_TEMP/unealta/profil-3s-md-felie.json" --cu config/profil-3s-md.json -- "$@"
          }
          cu_profil pnpm build
          cu_profil node "$RUNNER_TEMP/unealta/colecteaza-build.mjs" --iesire "$RUNNER_TEMP/colectie-baza" --port 4760
      - name: Felia - build si colectie
        run: |
          git checkout -q --detach "$FELIE"
          pnpm install --frozen-lockfile
          pnpm build
          node "$RUNNER_TEMP/unealta/colecteaza-build.mjs" --iesire "$RUNNER_TEMP/colectie-felie" --port 4760
      - name: Comparatia baza contra felie (zero diferente)
        run: |
          python "$RUNNER_TEMP/unealta/compara-build.py" --regula invarianta --normalizator "$RUNNER_TEMP/unealta/normalizeaza.ts" \
            "$RUNNER_TEMP/colectie-baza" "$RUNNER_TEMP/colectie-felie"
