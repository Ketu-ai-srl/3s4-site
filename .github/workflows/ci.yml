name: CI

on:
  # Fara `paths-ignore`: promovarea unui lot cere un verdict CI pe sha-ul exact.
  # Un lot numai cu documente n-ar fi produs nicio rulare, iar promoveaza.sh l-ar fi
  # refuzat cu "zero rulari CI" - o poarta care blocheaza exact cazul pentru care exista.
  # Depozitul e public, deci minutele nu sunt argument.
  push:
    # `lot/**` e aici fiindca promovarea cere un verdict CI pe sha-ul EXACT al lotului,
    # inainte ca el sa atinga `main`. Fara asta, `promoveaza.sh` refuza corect cu "zero
    # rulari CI", iar singurul drum ramas ar fi sa impingi direct in `main` si sa afli
    # dupa. Un lot pe zi inseamna o rulare in plus, pe un depozit public.
    #
    # `ci/**` (25.09.2026): verdictul de test al feliilor si loturilor vine de aici, nu de pe statia de
    # lucru (depozit public: minutele sunt gratuite, iar poarta locala ocupa masina agentilor). Pe
    # `ci/<nume>` se impinge un INSTANTANEU - acelasi arbore ca felia, parinte `main` - prin
    # `ci-instantaneu.sh` al fabricii, ca istoricul de lucru sa nu devina public.
    branches: [main, 'lot/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verdict:
    name: Verdict CI
    # WINDOWS, nu Linux (25.09.2026). Masuratorile referintei si probele de browser care le cer la
    # ±3 px au fost facute pe Windows. Prima rulare pe ubuntu-latest (36159283064) a picat 4 din 287,
    # toate pe geometrie si interactiuni: randul de integrari al constructorului 1598 fata de 1569 la
    # 390 (un rand de text rupt altfel), inaltimile lumilor si ale chestionarului, turul eroului la
    # 390 tactil. Aceleasi probe trec pe statia Windows. CI verifica deci pe acelasi sistem pe care
    # s-au luat cifrele; depozitul e public, deci si runner-ele Windows sunt gratuite.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # Limita e ~2x durata proiectata pentru ~60 de rute (planul valului S4, P4 si §6.11), nu
    # pentru azi. Masurat pe 2026-09-24, pe masina de lucru a feliei `fundatie` (Windows), cu o
    # singura ruta: `pnpm verifica` = 104 s, din care portile de browser 49 s pentru 37 de probe.
    # Portile care trec prin fiecare ruta costa ~9,6 s pe ruta (accesibilitate 2,6 + terti 3,9 +
    # derapaj 1,0 + HTML brut 1,2 + legaturi 0,9). Proiectie la ~60 de rute: ~9,6 min pentru ele,
    # ~5 min restul lantului (build mai mare, probele feliilor S4-2..S4-4), ~2 min instalarea si
    # Chromium in CI = ~17 min; limita 35. Viteza masinii de CI fata de cea locala NU e masurata:
    # la primul verdict cu peste 40 de rute se compara durata reala cu proiectia si se reface cifra.
    # Alternativa lasata deocamdata: portile de browser impartite pe joburi paralele. Cere build-ul
    # repetat in fiecare job si o verificare ca promovarea citeste toate joburile, nu doar acesta;
    # se reia daca durata reala trece de jumatatea limitei.
    # Masurat 25.09 pe ubuntu-latest, 22 de rute: 1062 s in total, din care 15,6 min probele de browser
    # (287). Runner-ul Windows e mai lent, iar valul S4 aduce ~40 de rute: limita 60.
    # Masurat 26.09 pe windows-latest, lotul de proba S4-3 (39 de pagini statice, 582 unit + 753 browser):
    # 41,3 min in total, din care `pnpm verifica` 37,6 min. S4-4a aduce inca ~13 rute, deci ~55 min, prea
    # aproape de 60: limita 120. Impartirea portilor de browser pe joburi ramane alternativa de mai sus.
    timeout-minutes: 120
    env:
      BUILD_STANDALONE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # TEMP pe acelasi disc cu depozitul. Pe runner-ul Windows depozitul sta pe D: si TEMP pe C:;
      # probele care construiesc o COPIE a site-ului in TEMP (comutatorul operatorului, antetul)
      # au picat cu `Can't resolve './D:/a/3s4-site/...next/dist/client/next.js'`: webpack nu poate
      # scrie o cale relativa intre doua discuri (rularea 36161321352). Pe statie totul e pe C:.
      - run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # Probele de browser fac parte din `pnpm verifica`, deci si din poarta locala:
      # poarta.sh isi citeste pasii din acelasi script. Fara pasul asta, CI a picat
      # 17 din 17 cu "Executable doesn't exist" - masurat pe rularea 33965447045.
      # Se instaleaza doar chromium: probele ruleaza pe un singur motor.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verifica
      - name: Declanseaza deploy staging
        if: github.ref == 'refs/heads/main' && success()
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ]; then
            echo "COOLIFY_DEPLOY_URL nu e setat inca - deploy-ul se declanseaza manual din Coolify"
            exit 0
          fi
          curl -sf -X POST "$COOLIFY_DEPLOY_URL"

  # AL DOILEA BUILD: aplicatia 3s.md (fundatia editiilor, `src/lib/editii.ts`). Acelasi cod se construieste cu
  # variabilele din `config/profil-3s-md.json` (SITE_EDITII=en,ro-MD, operatorul-model, mediul de proba): pe acest
  # profil arborele romanesc nu exista deloc, deci nimic din jobul de mai sus nu-l masoara. Aici se masoara ce
  # serveste: poarta juridica pe build-ul lui si proba editiilor pe serverul lui (`tests/editii.test.ts`, blocul
  # care cere `EDITII_ADRESA`). Job separat, in paralel cu cel de mai sus: concluzia rularii le cere pe amandoua.
  # Fara `BUILD_STANDALONE`: serverul pornit aici e `next start`, iar iesirea standalone nu schimba paginile.
  # Windows, ca jobul de mai sus. Durata: masurata la primul verdict, scrisa aici dupa aceea.
  profil-3s-md:
    name: Profil 3s.md
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # Variabilele profilului intra in mediul pasilor urmatori; cheile cu `_` sunt note, o valoare obiect se scrie ca JSON.
      - name: Variabilele aplicatiei 3s.md
        run: |
          node -e "const p=require('./config/profil-3s-md.json');const fs=require('fs');for(const [k,v] of Object.entries(p)){if(k.startsWith('_'))continue;fs.appendFileSync(process.env.GITHUB_ENV,k+'='+(typeof v==='string'?v:JSON.stringify(v))+'\n')}"
      - run: pnpm build
      # Poarta juridica pe build-ul 3s.md, cu paginile juridice EN si RO-MD construite. Pe staging e blocanta, iar
      # iesirea trebuie sa poarte linia modelului D2 (operatorul-model din profil a fost citit, nu sarit).
      - name: Poarta juridica 3s.md (staging, blocant)
        run: |
          python .claude/scripts/porti/poarta-juridic.py --mediu staging | tee "$RUNNER_TEMP/poarta-juridic-staging.log"
          grep -q '^model D2: aprins' "$RUNNER_TEMP/poarta-juridic-staging.log" || { echo "lipseste linia 'model D2' din iesirea portii juridice"; exit 1; }
      # Pe productie, INFORMATIV pana la poarta B: raman intentionat marcajele reprezentantului UE (asteapta juristul),
      # N20 (acceptarea termenilor pe client) si N26 (stergerea completa a datelor unui client), cum le raporteaza
      # poarta pe productie; N23 (tara gazdei) a iesit din textele juridice. Pasul nu pica jobul; iesirea numeste ce
      # mai opreste publicarea.
      # Trecerea lui pe blocant e pasul portii B, nu al feliei.
      - name: Poarta juridica 3s.md (productie, informativ)
        run: |
          python .claude/scripts/porti/poarta-juridic.py --mediu productie || echo "poarta juridica pe productie a iesit $? (informativ pana la poarta B)"
      # Poarta de SEO pe HTML-ul build-ului 3s.md: CANALE_JSON din profil e in mediu, deci telefonul canalului e permis in JSON-LD, si numai el.
      - run: python .claude/scripts/porti/poarta-seo.py
      # Reciprocitatea hreflang pe build-ul 3s.md: profilul (en, ro-MD) se citeste din build, perechile asteptate din
      # src/content/echivalente.ts. Pe build-ul romanesc poarta ruleaza in porti:build si cere zero alternate.
      - run: python .claude/scripts/porti/poarta-reciprocitate.py
      - name: Proba editiilor, pe serverul build-ului 3s.md
        run: |
          pnpm exec next start -p 4750 -H 127.0.0.1 > "$RUNNER_TEMP/server-3s-md.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4750/robots.txt && break; sleep 1; done
          EDITII_ADRESA=http://127.0.0.1:4750 pnpm exec vitest run tests/editii.test.ts
      - name: Jurnalul serverului 3s.md
        if: always()
        run: cat "$RUNNER_TEMP/server-3s-md.log" || true
